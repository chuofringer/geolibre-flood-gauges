name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build:geolibre

      - name: Validate plugin bundle
        run: npm run validate:plugin

      - name: Bundle size report
        run: |
          echo "### Bundle size" >> "$GITHUB_STEP_SUMMARY"
          du -h geolibre-plugin/dist/index.js geolibre-plugin/dist/style.css >> "$GITHUB_STEP_SUMMARY"
