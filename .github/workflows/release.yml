name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run package:geolibre
      - run: npm run validate:plugin

      - name: Attach zip to the GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: geolibre-plugin/*.zip
          generate_release_notes: true
